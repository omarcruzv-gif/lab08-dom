<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor de tareas</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
            color: #243b53;
        }

        .contenedor {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        input {
            padding: 12px;
            width: 65%;
        }

        button {
            padding: 12px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #2874a6;
            color: white;
        }

        li {
            margin: 12px 0;
            padding: 12px;
            background: #edf2f7;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .completada {
            text-decoration: line-through;
            color: gray;
        }

        .borrar {
            background: #c0392b;
        }

        .completar {
            background: #239b56;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>Mi Gestor de Tareas</h1>

        <p>Organiza tus actividades diarias.</p>

        <form id="formularioTarea">

            <input
                type="text"
                id="nombreTarea"
                placeholder="Escribe una tarea"
                required
            >

            <button type="submit">Agregar</button>

        </form>

        <h2>Lista de tareas</h2>

        <ul id="listaTareas"></ul>

        <p id="contadorTareas">Tareas pendientes: 0</p>

    </div>

    <script src="app.js"></script>

</body>

</html>
